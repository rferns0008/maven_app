apiVersion: apps/v1
kind: Deployment
metadata:
  name: maven-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maven-app
  template:
    metadata:
      labels:
        app: maven-app
    spec:
      containers:
        - name: maven-app
          image: rferns/maven-app:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting maven-app container";
              # run the image default command (prints Hello World)
              /proc/1/exe || true;
              echo "Keeping container alive";
              while true; do sleep 3600; done
