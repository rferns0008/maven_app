---
- name: Deploy Maven App Docker Container
  hosts: all
  become: true

  vars:
    # Internal defaults (never self-reference)
    _docker_image_name_default: my-app
    _docker_image_tag_default: latest

    # Public vars with safe fallback
    docker_image_name: "{{ docker_image_name | default(_docker_image_name_default) }}"
    docker_image_tag: "{{ docker_image_tag | default(_docker_image_tag_default) }}"

    container_name: my-app
    container_port: 8080
    host_port: 8080

  tasks:

    - name: Ensure Docker is installed
      apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Ensure ubuntu user is in docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Pull and run application container
      docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image_name }}:{{ docker_image_tag }}"
        state: started
        restart_policy: always
        recreate: true
        published_ports:
          - "{{ host_port }}:{{ container_port }}"
