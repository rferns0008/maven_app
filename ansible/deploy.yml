---
- name: Deploy Maven App Docker Container
  hosts: all
  become: true

  vars:
    # Hard defaults (never overridden internally)
    image_name_default: my-app
    image_tag_default: latest

  tasks:

    - name: Resolve Docker image name safely
      set_fact:
        docker_image_name_resolved: "{{ docker_image_name | default(image_name_default) }}"
        docker_image_tag_resolved: "{{ docker_image_tag | default(image_tag_default) }}"

    - name: Ensure Docker is installed
      apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Ensure ubuntu user is in docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Pull and run application container
      docker_container:
        name: my-app
        image: "{{ docker_image_name_resolved }}:{{ docker_image_tag_resolved }}"
        state: started
        restart_policy: always
        recreate: true
        published_ports:
          - "8080:8080"
